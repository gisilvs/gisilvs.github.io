<svg xmlns="http://www.w3.org/2000/svg" width="740" height="310" viewBox="0 0 740 310" role="img" aria-labelledby="title description">
  <title id="title">Generating text-conditioned training pairs</title>
  <desc id="description">A text prompt passes through an eight-step INT8 latent generator, then the SAME decoder. CREPE checks decoded audio against the requested pitch. Accepted raw latents, decoded audio and note settings are saved together.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#637067" />
    </marker>
    <marker id="gradient" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#a96542" />
    </marker>
    <symbol id="text" viewBox="0 0 48 30">
      <path d="M8 3H40V27H8Z M14 10H34 M14 15H31 M14 20H26" />
    </symbol>
    <symbol id="tensor" viewBox="0 0 48 30">
      <path d="M7 9H33V27H7Z M12 5H38V23 M17 1H43V19 M16 9V27 M24 9V27 M7 18H33" />
    </symbol>
    <symbol id="decoder" viewBox="0 0 48 30">
      <path d="M7 10L41 2V28L7 20Z" />
    </symbol>
    <symbol id="wave" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 14V18M9 10V22M15 4V28M21 8V24M27 12V20M33 3V29M39 7V25M45 11V21M51 6V26M57 13V19M63 15V17"/>
  </symbol>
    <symbol id="generator-network" viewBox="0 0 48 30">
      <g stroke-width="0.8" opacity="0.7">
        <path d="M6 8L18 5" />
        <path d="M6 8L18 15" />
        <path d="M6 8L18 25" />
        <path d="M6 22L18 5" />
        <path d="M6 22L18 15" />
        <path d="M6 22L18 25" />
        <path d="M18 5L30 5" />
        <path d="M18 5L30 15" />
        <path d="M18 5L30 25" />
        <path d="M18 15L30 5" />
        <path d="M18 15L30 15" />
        <path d="M18 15L30 25" />
        <path d="M18 25L30 5" />
        <path d="M18 25L30 15" />
        <path d="M18 25L30 25" />
        <path d="M30 5L42 8" />
        <path d="M30 5L42 22" />
        <path d="M30 15L42 8" />
        <path d="M30 15L42 22" />
        <path d="M30 25L42 8" />
        <path d="M30 25L42 22" />
      </g>
      <g fill="#f7f7f2" stroke-width="1.2">
        <circle cx="6" cy="8" r="2.2" />
        <circle cx="6" cy="22" r="2.2" />
        <circle cx="18" cy="5" r="2.2" />
        <circle cx="18" cy="15" r="2.2" />
        <circle cx="18" cy="25" r="2.2" />
        <circle cx="30" cy="5" r="2.2" />
        <circle cx="30" cy="15" r="2.2" />
        <circle cx="30" cy="25" r="2.2" />
        <circle cx="42" cy="8" r="2.2" />
        <circle cx="42" cy="22" r="2.2" />
      </g>
    </symbol>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#202e2b">
    <text x="18" y="29" font-size="15" font-weight="600">Generate the dataset</text>
    <rect x="18" y="60" width="118" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#text" x="53.0" y="74" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="77.0" y="125" text-anchor="middle" font-size="12" font-weight="500">Text prompt</text>
    <text x="77.0" y="141" text-anchor="middle" font-size="10" fill="#637067">One requested note</text>
    <rect x="162" y="60" width="126" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#generator-network" x="201.0" y="74" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="225.0" y="125" text-anchor="middle" font-size="12" font-weight="500">Latent generator</text>
    <text x="225.0" y="141" text-anchor="middle" font-size="10" fill="#637067">INT8 · 8 steps</text>
    <rect x="314" y="60" width="112" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#tensor" x="346.0" y="74" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="370.0" y="125" text-anchor="middle" font-size="12" font-weight="500">Generated latent</text>
    <text x="370.0" y="141" text-anchor="middle" font-size="10" fill="#637067">256 × 66</text>
    <rect x="452" y="60" width="114" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#decoder" x="485.0" y="74" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="509.0" y="125" text-anchor="middle" font-size="12" font-weight="500">SAME decoder</text>
    <rect x="592" y="60" width="130" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#wave" color="#347358" x="633.0" y="74" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="657.0" y="125" text-anchor="middle" font-size="12" font-weight="500">Decoded audio</text>
    <text x="657.0" y="141" text-anchor="middle" font-size="10" fill="#637067">Mono · 24 kHz</text>
    <path d="M140 105H156" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M292 105H308" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M430 105H446" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M570 105H586" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M370 150V209" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M657 150V189" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="592" y="195" width="130" height="70" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <text x="657" y="220" text-anchor="middle" font-size="12" font-weight="500">CREPE pitch check</text>
    <text x="657" y="243" text-anchor="middle" font-size="11" fill="#637067">Matches the note?</text>
    <text x="657" y="286" text-anchor="middle" font-size="11" fill="#a96542">Retry if rejected</text>
    <rect x="220" y="215" width="310" height="80" rx="8" fill="#eef2e9" stroke="#bdc8bd" />
    <text x="375" y="239" text-anchor="middle" font-size="13" font-weight="600">Save accepted pair</text>
    <text x="375" y="261" text-anchor="middle" font-size="12">Raw latent + decoded audio</text>
    <text x="375" y="281" text-anchor="middle" font-size="12" fill="#637067">Median pitch + fixed note timing</text>
    <path d="M592 230H560V255H536" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="561" y="278" text-anchor="middle" font-size="10" fill="#637067">Accept</text>
  </g>
</svg>