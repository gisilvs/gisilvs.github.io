<svg xmlns="http://www.w3.org/2000/svg" width="740" height="365" viewBox="0 0 740 365" role="img" aria-labelledby="title description">
  <title id="title">Training the mapper on generated pairs</title>
  <desc id="description">Only the saved raw latent enters the parameter mapper. Its predicted preset and separately supplied pitch and timing enter the differentiable synth. STFT and log-mel losses compare rendered audio with the saved decoded target. Gradients pass through the synth to the mapper.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#637067" />
    </marker>
    <marker id="gradient" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#a96542" />
    </marker>
    <symbol id="tensor" viewBox="0 0 48 30">
      <path d="M7 9H33V27H7Z M12 5H38V23 M17 1H43V19 M16 9V27 M24 9V27 M7 18H33" />
    </symbol>
    <symbol id="wave" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 14V18M9 10V22M15 4V28M21 8V24M27 12V20M33 3V29M39 7V25M45 11V21M51 6V26M57 13V19M63 15V17"/>
  </symbol>
    <symbol id="controls" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3V29M32 3V29M54 3V29"/><path d="M4 10H16M26 22H38M48 14H60" stroke-width="4"/>
  </symbol>
    <symbol id="synth" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="2" width="58" height="28" rx="2"/>
    <path d="M3 12H61M15 12V30M27 12V30M39 12V30M51 12V30M35 9 39 5V9L43 5V9L47 5"/>
    <circle cx="10" cy="7" r="1.5"/><circle cx="20" cy="7" r="1.5"/>
    <path d="M12 12H18V21H12ZM24 12H30V21H24ZM48 12H54V21H48Z" fill="currentColor" stroke="none"/>
  </symbol>
    <symbol id="network" viewBox="0 0 48 30">
      <path d="M9 5L24 9 39 5 M9 5L24 21 39 15 M9 25L24 9 39 25 M9 25L24 21 39 5" />
      <g fill="#f7f7f2">
        <circle cx="9" cy="5" r="2.5" />
        <circle cx="9" cy="25" r="2.5" />
        <circle cx="24" cy="9" r="2.5" />
        <circle cx="24" cy="21" r="2.5" />
        <circle cx="39" cy="5" r="2.5" />
        <circle cx="39" cy="15" r="2.5" />
        <circle cx="39" cy="25" r="2.5" />
      </g>
    </symbol>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#202e2b" transform="translate(0,-325)">
    <text x="18" y="350" font-size="15" font-weight="600">Train with the saved pairs</text>
    <rect x="430" y="375" width="170" height="38" rx="6" fill="#f7f7f2" stroke="#bdc8bd" />
    <text x="515" y="399" text-anchor="middle" font-size="12">Pitch + note timing</text>
    <path d="M515 413V439" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="18" y="445" width="118" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#tensor" x="53.0" y="459" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="77.0" y="510" text-anchor="middle" font-size="12" font-weight="500">Saved latent</text>
    <text x="77.0" y="526" text-anchor="middle" font-size="10" fill="#637067">Unchanged</text>
    <rect x="162" y="445" width="126" height="90" rx="8" fill="#e5efe8" stroke="#347358" />
    <use href="#network" x="201.0" y="459" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="225.0" y="510" text-anchor="middle" font-size="12" font-weight="500">Parameter mapper</text>
    <text x="225.0" y="526" text-anchor="middle" font-size="10" fill="#637067">Trainable</text>
    <rect x="314" y="445" width="112" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#controls" color="#347358" x="346.0" y="459" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="370.0" y="510" text-anchor="middle" font-size="12" font-weight="500">Predicted preset</text>
    <text x="370.0" y="526" text-anchor="middle" font-size="10" fill="#637067">Controls + waves</text>
    <rect x="452" y="445" width="114" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#synth" color="#347358" x="485.0" y="459" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="509.0" y="510" text-anchor="middle" font-size="12" font-weight="500">PyTorch synth</text>
    <text x="509.0" y="526" text-anchor="middle" font-size="10" fill="#637067">Differentiable</text>
    <rect x="592" y="445" width="130" height="90" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <use href="#wave" color="#347358" x="633.0" y="459" width="48" height="30" fill="none" stroke="#347358" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="657.0" y="510" text-anchor="middle" font-size="12" font-weight="500">Rendered audio</text>
    <text x="657.0" y="526" text-anchor="middle" font-size="10" fill="#637067">Reconstruction</text>
    <path d="M140 490H156" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M292 490H308" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M430 490H446" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M570 490H586" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="330" y="565" width="174" height="60" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <text x="417" y="590" text-anchor="middle" font-size="12" font-weight="500">Saved decoded audio</text>
    <text x="417" y="610" text-anchor="middle" font-size="11" fill="#637067">Reconstruction target</text>
    <rect x="592" y="565" width="130" height="60" rx="8" fill="#f7f7f2" stroke="#bdc8bd" />
    <text x="657" y="590" text-anchor="middle" font-size="12" font-weight="500">Audio loss</text>
    <text x="657" y="610" text-anchor="middle" font-size="11" fill="#637067">STFT + log-mel</text>
    <path d="M657 535V559" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M510 595H586" fill="none" stroke="#637067" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M592 615H562V650H225V541" fill="none" stroke="#a96542" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#gradient)" />
    <text x="390" y="677" text-anchor="middle" font-size="12" fill="#a96542">Backpropagate through the synth; update only the mapper</text>
  </g>
</svg>